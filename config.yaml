ai_analysis:
  analysis_interval: 1800
  api_key: ''
  base_url: ''
  enable_news_analysis: true
  enable_sentiment_analysis: true
  enable_technical_analysis: true
  enabled: false
  llm_provider: deepseek
  max_tokens: 2048
  model_name: deepseek-chat
  temperature: 0.7
  timeout: 30
backtest:
  commission: 0.0003
  end_date: '2024-01-01'
  initial_capital: 100000
  start_date: '2023-01-01'
cache:
  default_ttl: 3600
  key_prefix: 'trading:'
  l1_max_size: 500
  l1_ttl: 1800
  l2_ttl: 7200
  max_size: 1000
  redis_url: redis://localhost:6379
  type: memory
data:
  sources:
    backup: tushare
    primary: akshare
    realtime: sina
  tushare_token: ''
data_sources:
  backup: tushare
  primary: akshare
  realtime: sina
database:
  echo: false
  pool_size: 10
  url: sqlite:///stock_trading.db
logging:
  format: '{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}'
  level: INFO
  retention: 30 days
  rotation: 1 day
monitoring:
  check_interval: 60
  enable_auto_notification: true
  notification_cooldown: 300
  polling_interval: 30
  stock_thresholds: []
  stocks:
  - 000001.SZ
  - 000002.SZ
  - 600000.SH
  - 600036.SH
  - 600519.SH
  volatility_threshold: 0.03
news_rss:
  enabled: false
  enabled_sources: []
  fetch_interval: 3600
  keywords_filter: []
  max_articles: 100
  rss_sources:
  - https://feeds.finance.yahoo.com/rss/2.0/headline
  - http://rss.cnn.com/rss/money_latest.rss
  storage_days: 30
notification:
  mention_all: false
  wecom:
    webhook_url: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=your_webhook_key
  wecom_enabled: false
  wecom_webhook_url: ''
risk_management:
  max_position_size: 10000.0
  max_positions: 5
  risk_tolerance: 0.02
  stop_loss: 0.05
  take_profit: 0.1
  trailing_stop:
    enabled: true
    percentage: 0.02
strategies:
  pressure_support_strategy:
    enabled: true
    params:
      long_window: 50
      short_window: 10
      volume_multiple: 2.0
strategy:
  analysis_period: 6
  name: pressure_support_strategy
  pressure_factor: 1.05
  support_factor: 0.95
  volume_threshold: 1.5
system:
  name: API Modified System
  timezone: Asia/Shanghai
  version: 1.0.0
web:
  host: 127.0.0.1
  n8n:
    api_key: ''
    base_url: http://localhost:5678
    enabled: false
    timeout: 30
    webhook_url: ''
    workflow_id: ''
  port: 8080

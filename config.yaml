# 量化股票交易系统配置文件

# 系统配置
system:
  name: "Quant Stock Alpha Engine"
  version: "1.0.0"
  timezone: "Asia/Shanghai"
  
# 数据源配置
data_sources:
  primary: "tushare"  # 主要数据源
  backup: "akshare"   # 备用数据源
  realtime: "sina"    # 实时数据源
  
# 监控配置
monitoring:
  stocks:
    - "000001.SZ"  # 平安银行
    - "000002.SZ"  # 万科A
    - "600000.SH"  # 浦发银行
    - "600036.SH"  # 招商银行
    - "600519.SH"  # 贵州茅台
  
  volatility_threshold: 0.03  # 3%波动率阈值
  check_interval: 60          # 检查间隔（秒）
  
# 交易策略配置
strategy:
  name: "pressure_support_strategy"
  parameters:
    analysis_period: 6        # 分析周期（月）
    pressure_factor: 1.05     # 压力位因子
    support_factor: 0.95      # 支撑位因子
    volume_threshold: 1.5     # 成交量阈值倍数
    
# 风险管理
risk_management:
  max_position_size: 10000    # 最大持仓金额
  max_positions: 5            # 最大持仓数量
  stop_loss: 0.05            # 止损比例 5%
  take_profit: 0.10          # 止盈比例 10%
  risk_tolerance: 0.02       # 风险容忍度 2%
  
# 通知配置
notification:
  wecom:
    enabled: true
    webhook_url: "${WECOM_WEBHOOK_URL}"
    mention_all: false
    
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    
# 数据库配置
database:
  url: "${DATABASE_URL}"
  echo: false
  pool_size: 10
  
# 日志配置
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  rotation: "1 day"
  retention: "30 days"
  
# 回测配置
backtest:
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  initial_capital: 100000
  commission: 0.0003         # 手续费率